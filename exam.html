<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varsity Vision - অনলাইন মেধা যাচাই ও মডেল টেস্ট পোর্টাল</title>
    
    <!-- Noto Serif Bengali Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: linear-gradient(135deg, #090d16 0%, #171f33 50%, #090d16 100%);
            --glass-card: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            --btn-gradient: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Serif Bengali', serif;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-main);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 50px;
            background-attachment: fixed;
        }

        /* প্রফেশনাল স্লিম নেভিগেশন বার */
        .sticky-header-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            padding: 8px 2%;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .navbar-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            padding: 8px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        /* মূল কন্টেন্ট লেআউট */
        main {
            margin-top: 120px;
            padding: 30px 5%;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            text-align: center;
        }

        .welcome-box {
            background: var(--glass-card);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            margin-bottom: 30px;
        }

        .welcome-box h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .welcome-box p {
            color: #cbd5e1;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* ক্যাটাগরি বাটন সেকশন */
        .exam-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .exam-btn {
            background: var(--glass-card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #f8fafc;
            padding: 20px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            display: block;
        }

        .exam-btn:hover {
            background: var(--btn-gradient);
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.5);
            color: #fff;
        }

        footer {
            background: #020617;
            color: #94a3b8;
            text-align: center;
            padding: 20px;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- প্রফেশনাল স্লিম নেভিগেশন বার (হোমপেজ বাটন সরানো হয়েছে) -->
    <div class="sticky-header-container">
        <div class="navbar-card">
            <a href="#" class="brand-name">Varsity Vision Portal</a>
        </div>
    </div>

    <!-- মূল কনটেন্ট -->
    <main>
        <div class="welcome-box">
            <h1>অনলাইন মেধা যাচাই ও মডেল টেস্ট পোর্টাল</h1>
            <p>আপনার কাঙ্ক্ষিত ক্যাটাগরি নির্বাচন করে মডেল টেস্ট পরীক্ষায় অংশগ্রহণ করুন।</p>
            
            <div class="exam-menu">
                <a href="questiondu.html" class="exam-btn">ঢাকা বিশ্ববিদ্যালয় মডেল টেস্ট</a>
                <a href="questionhsc.html" class="exam-btn">HSC একাডেমিক মডেল টেস্ট</a>
                <a href="questionvarsities.html" class="exam-btn">অন্যান্য বিশ্ববিদ্যালয় মডেল টেস্ট</a>
            </div>
        </div>
    </main>

    <!-- ফুটার -->
    <footer>
        <p>&copy; ২০২৬ Varsity Vision। সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

</body>
</html>
