<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varsity Vision AI - শিক্ষামূলক সার্চ ও চ্যাট অ্যাসিস্ট্যান্ট</title>

    <!-- Noto Serif Bengali Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: linear-gradient(135deg, #090d16 0%, #171f33 50%, #090d16 100%);
            --glass-card: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            --btn-gradient: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Serif Bengali', serif;
        }

        body {
            background: var(--bg-main);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-attachment: fixed;
        }

        /* 📌 হেডার স্টাইল */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            padding: 12px 5%;
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .back-btn {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(56, 189, 248, 0.15);
        }

        /* 📌 চ্যাট কন্টেইনার */
        .chat-container {
            flex: 1;
            max-width: 850px;
            width: 100%;
            margin: 90px auto 110px auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        /* চ্যাট মেসেজ বাবুল */
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .ai-message {
            align-self: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .user-avatar {
            background: #2563eb;
            color: #fff;
        }

        .ai-avatar {
            background: linear-gradient(135deg, #06b6d4, #c084fc);
            color: #0f172a;
        }

        .bubble {
            background: var(--glass-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.7;
            font-size: 0.98rem;
            color: #e2e8f0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .user-message .bubble {
            background: rgba(37, 99, 235, 0.25);
            border-color: rgba(56, 189, 248, 0.3);
            border-bottom-right-radius: 4px;
        }

        .ai-message .bubble {
            background: rgba(15, 23, 42, 0.85);
            border-bottom-left-radius: 4px;
        }

        /* 📌 নিচে ফিক্সড ইনপুট বক্স */
        .input-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 15px 5%;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-container {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 8px 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .input-container:focus-within {
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 1rem;
            padding: 6px;
        }

        .chat-input::placeholder {
            color: #94a3b8;
        }

        .send-btn {
            background: var(--btn-gradient);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.03);
        }

        /* টাইপিং লোডিং অ্যানিমেশন */
        .typing-indicator {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 6px 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #38bdf8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>

    <!-- হেডার -->
    <header>
        <a href="index.html" class="brand-name">varsity vision AI</a>
        <a href="index.html" class="back-btn">&larr; হোমপেজে ফিরুন</a>
    </header>

    <!-- চ্যাট হিস্ট্রি ডিসপ্লে -->
    <div class="chat-container" id="chatBox">
        <!-- প্রথম ওয়েলকাম মেসেজ -->
        <div class="message ai-message">
            <div class="avatar ai-avatar">AI</div>
            <div class="bubble">
                স্বাগতম! আমি Varsity Vision-এর এআই স্টাডি অ্যাসিস্ট্যান্ট। 🎓<br>
                এইচএসসি, বিশ্ববিদ্যালয় ভর্তি প্রস্তুতি, বিভিন্ন বিষয়ের গাইডলাইন বা পড়াশোনার রুটিন সংক্রান্ত যেকোনো প্রশ্ন আমাকে করতে পারো।
            </div>
        </div>
    </div>

    <!-- ইনপুট বক্স -->
    <div class="input-wrapper">
        <form class="input-container" onsubmit="handleSend(event)">
            <input type="text" id="userInput" class="chat-input" placeholder="পড়াশোনা বা ভর্তি সংক্রান্ত যেকোনো প্রশ্ন লিখুন..." autocomplete="off" required>
            <button type="submit" class="send-btn">পাঠান</button>
        </form>
    </div>

    <script>
        // ব্রাউজার বা লোকাল স্টোরেজ থেকে এপিআই কি চেক করা
        let GEMINI_API_KEY = localStorage.getItem("varsity_vision_ai_key");

        if (!GEMINI_API_KEY) {
            GEMINI_API_KEY = prompt("এডমিন সেটআপ: আপনার Google Gemini API Key এখানে দিন (এটি শুধু আপনার ব্রাউজারে সুরক্ষিত থাকবে):");
            if (GEMINI_API_KEY) {
                localStorage.setItem("varsity_vision_ai_key", GEMINI_API_KEY.trim());
            }
        }

        // পেজ লোড হলে index.html থেকে আসা সার্চ কুয়েরি (URL Parameter) রিড করা
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const initialQuery = urlParams.get('q');
            
            if (initialQuery && initialQuery.trim() !== '') {
                document.getElementById('userInput').value = initialQuery;
                sendMessage(initialQuery);
            }
        });

        function handleSend(e) {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (text) {
                sendMessage(text);
                input.value = '';
            }
        }

        async function sendMessage(text) {
            const chatBox = document.getElementById('chatBox');

            // ১. ইউজার মেসেজ রেন্ডার করা
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.innerHTML = `
                <div class="avatar user-avatar">You</div>
                <div class="bubble">${escapeHTML(text)}</div>
            `;
            chatBox.appendChild(userDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // ২. লোডিং ইণ্ডিকেটর দেখানো
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-message';
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.innerHTML = `
                <div class="avatar ai-avatar">AI</div>
                <div class="bubble">
                    <div class="typing-indicator">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // ৩. এআই থেকে উত্তর জেনারেট করা
            const aiResponse = await fetchGeminiResponse(text);

            // লোডিং সরিয়ে উত্তর বসানো
            chatBox.removeChild(loadingDiv);

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.innerHTML = `
                <div class="avatar ai-avatar">AI</div>
                <div class="bubble">${formatAIResponse(aiResponse)}</div>
            `;
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Gemini API Call Function
        async function fetchGeminiResponse(userPrompt) {
            if (!GEMINI_API_KEY) {
                return "দুঃখিত, কোনো এপিআই কি (API Key) পাওয়া যায়নি। দয়া করে পেজটি রিফ্রেশ করে আপনার জেমিনি এপিআই কি প্রদান করুন।";
            }

            const systemInstruction = "তুমি Varsity Vision নামক বিশ্ববিদ্যালয় ভর্তি ও HSC একাডেমিক প্ল্যাটফর্মের সেরা শিক্ষা সহায়ক এআই। তোমার প্রধান লক্ষ্য শিক্ষার্থীদের পড়াশোনা, বিষয়ভিত্তিক গাইডলাইন, রুটিন এবং বিশ্ববিদ্যালয় ভর্তি পরীক্ষার সঠিক তথ্য প্রদান করা। তুমি সবসময় বন্ধুত্বপূর্ণ ও উৎসাহব্যঞ্জক বাংলায় উত্তর দেবে।";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `${systemInstruction}\n\nশিক্ষার্থীর প্রশ্ন: ${userPrompt}` }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates.length > 0) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return "এপিআই কি (API Key) সঠিক নয় অথবা কোনো সমস্যা হয়েছে। দয়া করে আপনার কি-টি চেক করুন।";
                }
            } catch (error) {
                console.error("API Error:", error);
                return "দুঃখিত, প্রযুক্তিগত সমস্যার কারণে এই মুহূর্তে উত্তর দেওয়া সম্ভব হচ্ছে না।";
            }
        }

        // টেক্সট ফরম্যাটিং (Markdown to HTML)
        function formatAIResponse(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        // সিকিউরিটি বা এক্সএসএস প্রিভেনশন
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
