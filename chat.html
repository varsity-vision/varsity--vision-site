<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision AI - Varsity Vision</title>
    <!-- Noto Serif Bengali Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --border-glass: rgba(56, 189, 248, 0.2);
            --accent-cyan: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Serif Bengali', serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* প্রিমিয়াম হেডার ডিজাইন */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            z-index: 10;
        }

        .chat-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .chat-title {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-cyan);
            padding: 8px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            border: 1px solid var(--border-glass);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--accent-cyan);
            color: #0f172a;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* মূল হিরো কনটেন্ট এলাকা */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-card {
            background: rgba(23, 31, 51, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .bot-icon-badge {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.4);
        }

        .hero-card h2 {
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .hero-card p {
            font-size: 0.95rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .pulse-text {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>

    <!-- হেডার -->
    <div class="chat-header">
        <div class="chat-title-group">
            <div class="status-dot"></div>
            <div class="chat-title">Varsity Vision AI</div>
        </div>
        <a href="index.html" class="back-btn">&larr; হোমপেজে ফিরুন</a>
    </div>

    <!-- মূল কার্ড -->
    <div class="main-container">
        <div class="hero-card">
            <div class="bot-icon-badge">🎓</div>
            <h2>Varsity Vision AI Assistant</h2>
            <p>এইচএসসি ও বিশ্ববিদ্যালয় ভর্তি প্রস্তুতি বা পড়াশোনার যেকোনো বিষয়ে সাহায্য পেতে আমাদের এআই অ্যাসিস্ট্যান্ট প্রস্তুত রয়েছে।</p>
            <div class="pulse-text">👉 নিচের ডানপাশের চ্যাট আইকনে ক্লিক করে কথা বলুন</div>
        </div>
    </div>

    <!-- 📌 Botpress Embed Script -->
    <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/11/02/14/20261102144444-PXC9X7JO.js" defer></script>

</body>
</html>
