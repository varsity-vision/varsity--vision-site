<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision AI - Varsity Vision</title>
    <!-- Noto Serif Bengali Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: linear-gradient(135deg, #090d16 0%, #171f33 50%, #090d16 100%);
            --glass-card: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            --btn-gradient: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Serif Bengali', serif;
        }
        body {
            background: var(--bg-main);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* নেভিগেশন হেডার */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chat-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #38bdf8;
            padding: 6px 14px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }
        /* চ্যাট উইন্ডো */
        .chat-container {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.ai {
            background: var(--glass-card);
            border: 1px solid rgba(255, 255, 255, 0.12);
            align-self: flex-start;
            color: #f8fafc;
            border-bottom-left-radius: 4px;
        }
        .message.user {
            background: var(--btn-gradient);
            align-self: flex-end;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        /* ইনপুট এরিয়া */
        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 15px 10px;
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .chat-input-area input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        .chat-input-area button {
            padding: 10px 24px;
            background: var(--btn-gradient);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
            transition: transform 0.2s;
        }
        .chat-input-area button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="chat-header">
        <div class="chat-title">varsity vision AI</div>
        <a href="index.html" class="back-btn">&larr; হোমপেজে ফিরুন</a>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">স্বাগতম! আমি Varsity Vision-এর এআই স্টাডি অ্যাসিস্ট্যান্ট। 🎓 এইচএসসি, বিশ্ববিদ্যালয় ভর্তি প্রস্তুতি বা পড়াশোনা সংক্রান্ত যেকোনো প্রশ্ন আমাকে করতে পারো।</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="পড়াশোনা বা ভর্তি সংক্রান্ত যেকোনো প্রশ্ন লিখুন..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">পাঠান</button>
        </div>
    </div>

    <script>
        // ব্রাউজার পপআপের মাধ্যমে এপিআই কি নেওয়ার নিরাপদ ব্যবস্থা
        let API_KEY = localStorage.getItem("vision_gemini_key");

        if (!API_KEY) {
            API_KEY = prompt("দয়া করে আপনার Google AI Studio API Key দিন (এটি শুধুমাত্র আপনার ব্রাউজারে সুরক্ষিত থাকবে):");
            if (API_KEY) {
                localStorage.setItem("vision_gemini_key", API_KEY.trim());
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            if (!API_KEY) {
                alert("এপিআই কি (API Key) দেওয়া হয়নি!");
                return;
            }

            const chatMessages = document.getElementById('chatMessages');

            // ইউজারের মেসেজ যোগ করা
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = messageText;
            chatMessages.appendChild(userMsg);

            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // লোডিং মেসেজ
            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai';
            aiMsg.innerText = "চিন্তা করছি...";
            chatMessages.appendChild(aiMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // লেটেস্ট জেমিনি মডেল ব্যবহার করা হয়েছে
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "তুমি Varsity Vision এর একজন হেল্পফুল স্টাডি অ্যাসিস্ট্যান্ট। শিক্ষার্থীদের ভর্তি ও পড়াশোনার ব্যাপারে বাংলায় সাহায্য করো। প্রশ্নটি হলো: " + messageText }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiMsg.innerText = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    aiMsg.innerText = "এরর: " + data.error.message;
                } else {
                    aiMsg.innerText = "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";
                }
            } catch (error) {
                aiMsg.innerText = "নেটওয়ার্ক সমস্যা বা এপিআই কি (API Key) সঠিক নয়।";
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
