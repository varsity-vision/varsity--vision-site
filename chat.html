<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision AI - Varsity Vision</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: linear-gradient(135deg, #090d16 0%, #171f33 50%, #090d16 100%);
            --glass-card: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            --btn-gradient: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Serif Bengali', serif;
        }
        body {
            background: var(--bg-main);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(9, 13, 22, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chat-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #38bdf8;
            padding: 6px 14px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .chat-container {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.ai {
            background: var(--glass-card);
            border: 1px solid rgba(255, 255, 255, 0.12);
            align-self: flex-start;
        }
        .message.user {
            background: var(--btn-gradient);
            align-self: flex-end;
            color: #fff;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 50px;
            margin-bottom: 20px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input-area button {
            padding: 10px 22px;
            background: var(--btn-gradient);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="chat-header">
        <div class="chat-title">varsity vision AI</div>
        <a href="index.html" class="back-btn">&larr; হোমপেজে ফিরুন</a>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">স্বাগতম! আমি Varsity Vision-এর এআই স্টাডি অ্যাসিস্ট্যান্ট। 🎓 পড়াশোনা বা যেকোনো প্রশ্ন আমাকে করতে পারো।</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="পড়াশোনা বা যেকোনো প্রশ্ন লিখুন..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">পাঠান</button>
        </div>
    </div>

    <script>
        // 👉 আপনার জেমিনি এপিআই কি (API Key) সরাসরি নিচের কোটেশনের ভেতরে বসিয়ে দিন
        const API_KEY = "AQ.Ab8RN6InkwqDF4Kq8bJuAeu5w0sFugg0Nf5xEZ8BhiTNHYSf7w";

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            if (API_KEY === "AQ.Ab8RN6InkwqDF4Kq8bJuAeu5w0sFugg0Nf5xEZ8BhiTNHYSf7w" || !API_KEY) {
                alert("AQ.Ab8RN6InkwqDF4Kq8bJuAeu5w0sFugg0Nf5xEZ8BhiTNHYSf7w");
                return;
            }

            const chatMessages = document.getElementById('chatMessages');

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = messageText;
            chatMessages.appendChild(userMsg);

            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai';
            aiMsg.innerText = "চিন্তা করছি...";
            chatMessages.appendChild(aiMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "তুমি Varsity Vision এর একজন সহায়তামূলক এআই অ্যাসিস্ট্যান্ট। পড়াশোনা বা যেকোনো সাধারণ প্রশ্নের উত্তর বাংলায় দিতে পারো। প্রশ্ন: " + messageText }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
                    aiMsg.innerText = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    aiMsg.innerText = "এরর: " + data.error.message;
                } else {
                    aiMsg.innerText = "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";
                }
            } catch (error) {
                aiMsg.innerText = "নেটওয়ার্ক সমস্যা অথবা এপিআই কি-টি সঠিক নয়।";
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
